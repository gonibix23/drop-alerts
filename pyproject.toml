[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "drop-alerts"
version = "1.0.0"
description = "Alertas extensibles con persistencia, Discord y análisis semántico opcional"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<0.29",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.8,<3",
  "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
drop-alerts = "drop_alerts.__main__:main"

[tool.setuptools.packages.find]
include = ["drop_alerts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
